<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LOGIN</title>

    <!-- Favicons-->
    <link rel="shortcut icon" href="assets/ico/bw-favicon.png-v32.png" />

    <!-- Local Fonts -->
    <style>
      @font-face {
        font-family: "Athiti";
        src: url("assets/fonts/athiti-v2-thai_latin-regular.eot");
        src: url("assets/fonts/athiti-v2-thai_latin-regular.eot?#iefix")
            format("embedded-opentype"),
          url("assets/fonts/athiti-v2-thai_latin-regular.woff2") format("woff2"),
          url("assets/fonts/athiti-v2-thai_latin-regular.woff") format("woff"),
          url("assets/fonts/athiti-v2-thai_latin-regular.ttf")
            format("truetype"),
          url("assets/fonts/athiti-v2-thai_latin-regular.svg#Athiti")
            format("svg");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
    </style>

    <!-- Font Awesome (Local) -->
    <link
      rel="stylesheet"
      href="assets/font-awesome/css/font-awesome.min.css"
    />

    <!-- SweetAlert -->
    <script src="dist/sweetalert-dev.js"></script>
    <link rel="stylesheet" href="dist/sweetalert.css" />

    <!-- MD5 Library -->
    <script type="text/javascript" src="md5.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Athiti", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        background: #ffffff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 0;
      }

      .container {
        background: linear-gradient(135deg, #003c7e 0%, #0072bc 100%);
        /* border-radius: 20px; */
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        width: 100%;
        height: 100vh;
        max-width: 100vw;
        display: flex;
        overflow: hidden;
        position: relative;
      }
      /* Desktop - Left Side */
      .left-side {
        flex: 1;
        position: relative;
        width: 100%;
        height: 100%;
        padding: 40px;

        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;

        overflow: hidden;
        border-top-right-radius: 20px;
        border-bottom-right-radius: 20px;
      }

      .left-side::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
            135deg,
            rgba(0, 0, 0, 0.3),
            rgba(0, 0, 0, 0.1)
          ),
          url("assets/img/bg-login.png");
        background-size: cover;
        background-position: left center;
        background-repeat: no-repeat;
        z-index: 0;
      }

      .left-side > * {
        position: relative;
        z-index: 1;
      }

      /* Mobile Override */
      @media (max-width: 768px) {
        .left-side::before {
          background: linear-gradient(
              135deg,
              rgba(0, 0, 0, 0.3),
              rgba(0, 0, 0, 0.1)
            ),
            url("assets/img/bg-login-mobile.png");
          background-size: cover;
          background-position: top left;
        }
      }

      .bw-logo {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
        background: white;
        padding: 15px;
        border-radius: 0 0 15px 0;
      }

      .bw-logo img {
        height: 150px;
        width: auto;
      }

      /* Right Side - Form */
      .right-side {
        flex: 1;
        background: transparent;
        padding: 60px 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100vh;
        color: white;
      }

      .form-header {
        margin-bottom: 40px;
        text-align: left;
      }

      .form-header h2 {
        font-size: 36px;
        font-weight: 300;
        color: white;
        margin-bottom: 8px;
      }

      .form-header p {
        color: rgba(255, 255, 255, 0.8);
        font-size: 16px;
        font-weight: 300;
      }

      .form-group {
        margin-bottom: 20px;
        position: relative;
      }

      .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.9);
        margin-bottom: 8px;
      }

      .input-wrapper {
        position: relative;
      }

      .form-control {
        width: 100%;
        padding: 15px 20px 15px 45px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 400;
        color: #333;
        background: #ffffff;
        transition: all 0.3s ease;
        outline: none;
      }

      .form-control:focus {
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
      }

      .form-control::placeholder {
        color: #999;
        font-weight: 400;
      }

      .input-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #666;
        font-size: 16px;
      }

      .sign-in-btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .sign-in-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
      }

      .trial-btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #118211 0%, #3daa3d 100%);
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 10px;
      }

      .trial-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(17, 130, 17, 0.4);
        color: white;
        text-decoration: none;
      }

      .website-btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #b86822 0%, #ffa353 100%);
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .website-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(184, 104, 34, 0.4);
        color: white;
        text-decoration: none;
      }

      .footer-text {
        text-align: center;
        color: rgba(255, 255, 255, 0.6);
        font-size: 12px;
        margin-top: 30px;
        line-height: 1.4;
      }

      .header {
        margin-bottom: 30px;
        text-align: left;
      }

      .header h2 {
        font-size: 36px;
        font-weight: 300;
        color: white;
        margin-bottom: 8px;
      }

      .header p {
        color: rgba(255, 255, 255, 0.8);
        font-size: 16px;
        font-weight: 300;
      }

      .social-login p {
        text-align: center;
        color: rgba(255, 255, 255, 0.6);
        margin: 20px 0 10px 0;
        font-size: 14px;
      }

      /* Mobile Responsive */
      @media (max-width: 768px) {
        body {
          min-height: 100vh;
          align-items: center;
          justify-content: center;
        }

        .container {
          flex-direction: column;
          width: 100%;
          height: 100vh;
          max-width: 100vw;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .left-side {
          flex: 1;
          background: linear-gradient(
              135deg,
              rgba(0, 0, 0, 0.3),
              rgba(0, 0, 0, 0.1)
            ),
            url("assets/img/bg-login-mobile.png") top left/cover;
          padding: 20px;
          margin-right: 0;
          margin-bottom: 0;
          display: flex;
          align-items: flex-start;
          justify-content: flex-start;
          border-radius: 0; /* ลบ border-radius ใน mobile */
        }

        .bw-logo {
          position: absolute;
          top: 0;
          left: 0;
          text-align: left;
          display: none;
        }

        .bw-logo img {
          height: 45px;
          max-width: 200px;
        }

        .right-side {
          flex: 1;
          background: #ffffff;
          color: #003c7e;
          padding: 30px 25px;
          min-height: auto;
        }

        .header {
          margin-bottom: 25px;
        }

        .header h2 {
          font-size: 24px;
          margin-bottom: 5px;
          color: #003c7e;
        }

        .header p {
          font-size: 14px;
          color: rgba(0, 60, 126, 0.7);
        }

        .form-control {
          padding: 12px 15px 12px 40px;
          font-size: 15px;
          border: 1px solid #d9d9d9;
        }

        .form-group label {
          color: #003c7e;
        }

        .sign-in-btn,
        .trial-btn,
        .website-btn {
          padding: 12px;
          font-size: 14px;
          border-radius: 6px;
        }

        .footer-text {
          margin-top: 20px;
          font-size: 11px;
          color: rgba(0, 60, 126, 0.6);
        }
      }

      @media (max-width: 480px) {
        body {
          min-height: 100vh;
          align-items: center;
          justify-content: center;
        }

        .container {
          width: 100%;
          height: 100vh;
          max-width: 100vw;
        }

        .left-side {
          flex: 1;
          background: linear-gradient(
              135deg,
              rgba(0, 0, 0, 0.3),
              rgba(0, 0, 0, 0.1)
            ),
            url("assets/img/bg-login-mobile.png") top left/cover;
          padding: 15px;
          display: flex;
          align-items: flex-start;
          justify-content: flex-start;
          border-radius: 0; /* ลบ border-radius ใน mobile */
        }

        .bw-logo {
          position: absolute;
          top: 0;
          left: 0;
          text-align: left;
          display: none;
        }

        .bw-logo img {
          height: 40px;
          max-width: 180px;
        }

        .right-side {
          flex: 1;
          background: #ffffff;
          color: #003c7e;
          padding: 25px 20px;
        }

        .header {
          margin-bottom: 20px;
        }

        .header h2 {
          font-size: 22px;
          color: #003c7e;
        }

        .header p {
          color: rgba(0, 60, 126, 0.7);
        }

        .form-group label {
          color: #003c7e;
        }

        .form-control {
          padding: 11px 15px 11px 40px;
          font-size: 14px;
          border: 1px solid #d9d9d9;
        }

        .sign-in-btn,
        .trial-btn,
        .website-btn {
          padding: 11px;
          font-size: 13px;
        }

        .footer-text {
          margin-top: 15px;
          font-size: 10px;
          line-height: 1.3;
          color: rgba(0, 60, 126, 0.6);
        }
      }

      /* Very small screens */
      @media (max-width: 360px) {
        .left-side {
          padding: 12px;
          border-radius: 0;
          background-color: #003c7e;
          background-image: linear-gradient(
              135deg,
              rgba(0, 0, 0, 0.3),
              rgba(0, 0, 0, 0.1)
            ),
            url("assets/img/bg-login-mobile.png");
          background-size: cover;
          background-position: top center;
          background-repeat: no-repeat;
          background-origin: border-box;
          background-clip: border-box;
        }

        .bw-logo {
          position: absolute;
          top: 0;
          left: 0;
          display: none;
        }

        .bw-logo img {
          height: 35px;
          max-width: 150px;
        }

        .right-side {
          background: #ffffff;
          color: #003c7e;
          padding: 20px 15px;
        }

        .header h2 {
          font-size: 20px;
          color: #003c7e;
        }

        .header p {
          color: rgba(0, 60, 126, 0.7);
        }

        .form-group label {
          color: #003c7e;
        }

        .form-control {
          padding: 10px 15px 10px 35px;
          font-size: 13px;
          border: 1px solid #d9d9d9;
        }

        .sign-in-btn,
        .trial-btn,
        .website-btn {
          padding: 10px;
          font-size: 12px;
        }
      }
    </style>
  </head>

  <body>
    <!-- CHAP Authentication Forms (Original Logic) -->
    $(if chap-id)
    <form
      name="sendin"
      action="$(link-login-only)"
      method="post"
      style="display: none"
    >
      <input type="hidden" name="username" />
      <input type="hidden" name="password" />
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />
    </form>
    <script type="text/javascript">
      function doLogin() {
        // Debug
        if (!document.sendin) {
          console.error("sendin form not found");
          return false;
        }
        if (!document.login) {
          console.error("login form not found");
          return false;
        }
        if (!document.login.username || !document.login.password) {
          console.error("username or password field not found");
          return false;
        }

        document.sendin.username.value = document.login.username.value;
        document.sendin.password.value = hexMD5(
          "$(chap-id)" + document.login.password.value + "$(chap-challenge)"
        );
        document.sendin.submit();
        return false;
      }
    </script>
    $(endif)

    <!-- Error Handling (Original Logic) -->
    $(if error)
    <script>
      sweetAlert(
        {
          title: "Sorry!",
          text: "$(error)",
          type: "error",
          confirmButtonColor: "#ef3f23",
          confirmButtonText: "OK",
          showCancelButton: false,
          closeOnConfirm: false,
          showLoaderOnConfirm: true,
        },
        function () {
          setTimeout(function () {
            window.location.href = "login.html";
          }, 1000);
        }
      );
    </script>
    $(endif)

    <div class="container">
      <!-- Left Side - Image -->
      <div class="left-side">
        <div class="bw-logo">
          <img src="assets/img/BWLogo_Artboard.png" alt="Logo" />
        </div>
      </div>

      <!-- Right Side - Form -->
      <div class="right-side">
        <div class="header">
          <h2 >Login</h2>
          <p>Please log in to use</p>
        </div>

        <!-- Login Form (Original Logic with Modern UI) -->
        <form
          class="login-form"
          name="login"
          action="$(link-login-only)"
          method="post"
          $(if
          chap-id)
          onSubmit="return doLogin()"
          $(endif)
        >
          <input type="hidden" name="dst" value="$(link-orig)" />
          <input type="hidden" name="popup" value="true" />

          <!-- Username Field -->
          <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrapper">
              <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Username..."
                value="$(username)"
                required
              />
              <i class="fa fa-user input-icon" style="color: #003c7e"></i>
            </div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Password..."
                required
              />
              <i class="fa fa-lock input-icon" style="color: #003c7e"></i>
            </div>
          </div>

          <!-- Sign In Button -->
          <button type="submit" class="sign-in-btn">
            <i class="fa fa-home"></i> SignIn
          </button>
        </form>

        <!-- Social Login Section (Original Logic) -->
        <div class="social-login">
          $(if trial == 'yes')
          <a
            href="$(link-login-only)?dst=$(link-orig-esc)&username=T-$(mac-esc)"
            class="trial-btn"
          >
            <i class="fa fa-history"></i> Free Trial
          </a>
          $(endif)

          <a href="http://www.baanamphawa.com/" class="website-btn">
            <i class="fa fa-rss-square"></i> Web Site
          </a>
        </div>

        <!-- Footer -->
        <div class="footer-text">
          <p>
            Have problems in using, please contact
            <i class="fa fa-phone-square"></i> : 022484800
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
